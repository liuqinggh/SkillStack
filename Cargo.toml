[package]
name = "skillstack"
version = "0.2.1"
edition = "2021"
description = "Centralized skill management for Claude Code"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
colored = "2.1"
dialoguer = "0.11"
walkdir = "2.5"
regex = "1.10"
dirs = "5.0"
rayon = "1.10"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.10"
